name: Mevzuat ve Teşvik Takip Botu

on:
  schedule:
    # Türkiye saatiyle (UTC+3) her gün 09:00 - 23:00 arası saat başı çalışır
    - cron: '0 6-20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-mevzuat:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Depoyu İndir
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Gerekli Kütüphaneleri ve Tarayıcıyı Kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Kurumları Tara ve Bildirim Gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      - name: Hafızayı (seen_items.json) Güncelle
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/seen_items.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen_items.json" && git push)
